apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
      - name: consumer
        image: your-dockerhub-username/consumer-service:latest
        env:
        - name: RABBITMQ_URL
          value: amqp://guest:guest@rabbitmq.messaging.svc.cluster.local:5672/
        - name: RABBITMQ_QUEUE
          value: my_queue